trigger:
- main  # oder pc_branch, je nachdem welcher Branch deine Pipeline triggert

stages:
# ========================================================
# STAGE 1: BUILD
# ========================================================
- stage: Build
  displayName: 'Kompilieren und Testen'
  jobs:
  - job: BuildJob
    pool:
      vmImage: 'windows-latest'
    steps:

   
   - task: NuGetToolInstaller@1
    - task: NuGetCommand@2
      inputs:
        restoreSolution: '$(solution)'
    - task: VSBuild@1
      inputs:
        solution: '$(solution)'
        msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactStagingDirectory)"'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'
    - task: VSTest@2
      inputs:
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'


    - task: PublishBuildArtifacts@1
      displayName: 'Artefakte veröffentlichen'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# ========================================================
# STAGE 2: RELEASE
# ========================================================
- stage: Deploy
  displayName: 'In Produktion ausliefern'
  dependsOn: Build                  # Wartet, bis der Build erfolgreich war
  condition: succeeded()             # Läuft nur, wenn kein Test fehlgeschlagen ist
  jobs:
  - deployment: DeployJob
    displayName: 'Deployment Job'
    pool:
      vmImage: 'windows-latest'
    environment: 'Production'        # Erstellt automatisch eine Umgebung in Azure DevOps
    strategy:
      runOnce:
        deploy:
          steps:
          # Ein einfacher PowerShell-Schritt für die Bewertung,
          # der zeigt, dass die Dateien angekommen sind
          - powershell: |
              Write-Host "Starte Deployment..."
              Get-ChildItem $(Pipeline.Workspace)/drop
              Write-Host "Deployment erfolgreich abgeschlossen!"
            displayName: 'Simuliere App-Deployment'