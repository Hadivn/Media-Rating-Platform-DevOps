trigger:
- pc_branch  

variables:
  solution: '**/*.sln'        
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

stages:
# ========================================================
# STAGE 1: BUILD
# ========================================================
- stage: Build
  displayName: 'Kompilieren und Testen'
  jobs:
  - job: BuildJob
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: NuGetToolInstaller@1
      displayName: 'NuGet Tool Installer'

    - task: NuGetCommand@2
      displayName: 'NuGet Restore'
      inputs:
        restoreSolution: '$(solution)'

    - task: VSBuild@1
      displayName: 'Visual Studio Build'
      inputs:
        solution: '$(solution)'
        msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactStagingDirectory)"'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: VSTest@2
      displayName: 'Visual Studio Test'
      inputs:
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: CopyFiles@2
      displayName: 'Build-Dateien in Staging-Ordner kopieren'
      inputs:
        SourceFolder: '$(agent.builddirectory)'
        Contents: '**/bin/$(buildConfiguration)/**'
        TargetFolder: '$(build.artifactStagingDirectory)'
        CleanTargetFolder: true

    - task: PublishBuildArtifacts@1
      displayName: 'Artefakte veröffentlichen'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

# ========================================================
# STAGE 2: RELEASE
# ========================================================
- stage: Deploy
  displayName: 'In Produktion ausliefern'
  dependsOn: Build                  # Wartet, bis der Build erfolgreich war
  condition: succeeded()             # Läuft nur, wenn kein Test fehlgeschlagen ist
  jobs:
  - deployment: DeployJob
    displayName: 'Deployment Job'
    pool:
      vmImage: 'windows-latest'
    environment: 'Production'        # Erstellt automatisch eine Umgebung in Azure DevOps
    strategy:
      runOnce:
        deploy:
          steps:
          - powershell: |
              Write-Host "Starte Deployment..."
              # Zeigt den kompletten Inhalt des Workspace an, um zu sehen, wo die Dateien liegen
              Get-ChildItem $(Pipeline.Workspace) -Recurse -ErrorAction SilentlyContinue
              Write-Host "Deployment erfolgreich abgeschlossen!"
            displayName: 'Simuliere App-Deployment'