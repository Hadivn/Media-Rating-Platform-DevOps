trigger:
- pc_branch

variables:
- name: solution
  value: '**/*.sln'
- name: buildPlatform
  value: 'Any CPU'
- name: buildConfiguration
  value: 'Release'
- group: keyvault-secrets

stages:
- stage: Build
  displayName: 'Build und Test'
  jobs:
  - job: BuildJob
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: NuGetToolInstaller@1
      displayName: 'NuGet installieren'

    - task: NuGetCommand@2
      displayName: 'NuGet Pakete wiederherstellen'
      inputs:
        restoreSolution: '$(solution)'

    - task: VSBuild@1
      displayName: 'Projekt kompilieren'
      inputs:
        solution: '$(solution)'
        msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(Build.ArtifactStagingDirectory)"'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: VSTest@2
      displayName: 'Tests ausführen'
      inputs:
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: PublishBuildArtifacts@1
      displayName: 'Artefakt hochladen'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Echtes Release und Deployment'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployJob
    pool:
      vmImage: 'windows-latest'
    environment: 'Production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Echtes Cloud-Deployment in Azure App Service'
            inputs:
              azureSubscription: 'devops-rm' 
              appType: 'webApp'
              appName: 'mrp-devops-webapp' 
              package: '$(Pipeline.Workspace)/drop'
              appSettings: |
                -DB_CONNECTION_STRING_LONG "$(DbConnectionStringLong)"
                -DB_CONNECTION_STRING_SHORT "$(DbConnectionStringShort)"