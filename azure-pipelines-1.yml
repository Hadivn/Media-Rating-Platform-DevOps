# ASP.NET Build & Release Pipeline
trigger:
- pc_branch

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

stages:
- stage: Build
  displayName: 'Build und Test ASP.NET App'
  jobs:
  - job: BuildJob
    pool:
      vmImage: 'windows-latest'
    steps:
    - task: NuGetToolInstaller@1
      displayName: 'NuGet installieren'

    - task: NuGetCommand@2
      displayName: 'NuGet Pakete wiederherstellen'
      inputs:
        restoreSolution: '$(solution)'

    - task: VSBuild@1
      displayName: 'Projekt kompilieren & packen'
      inputs:
        solution: '$(solution)'
        msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(Build.ArtifactStagingDirectory)"'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: VSTest@2
      displayName: 'Tests ausführen'
      inputs:
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: PublishBuildArtifacts@1
      displayName: 'Artefakt hochladen'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Release & Deployment Stage'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    pool:
      vmImage: 'windows-latest'      
    steps:
    - task: DownloadBuildArtifacts@1
      displayName: 'Lade Artefakt drop herunter'
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'drop'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: CmdLine@2
      displayName: 'Führe Release Deployment aus'
      inputs:
        script: |
          echo "=========================================================="
          echo "Starte das automatisierte Release fuer die Media-Rating-Platform..."
          echo "Das Artefakt wurde erfolgreich heruntergeladen nach:"
          echo "$(System.ArtifactsDirectory)"
          echo "Bereit für die spätere Cloud-Anbindung in Punkt 4!"
          echo "=========================================================="